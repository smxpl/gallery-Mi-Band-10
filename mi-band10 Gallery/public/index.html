<!DOCTYPE html>
<html>
<head>
    <title>Mi Band 10 Gallery Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Create Your Mi Band 10 Gallery</h2>

<div class="container">
    <form action="/upload" method="POST" enctype="multipart/form-data">
        <label>Select 2–10 images:</label><br><br>
        <input type="file" name="images" multiple accept="image/*"><br><br>
        <button type="submit">Generate RPK</button>
    </form>
</div>

</body>
</html>
